# Development overrides — automatically merged with docker-compose.yml by `docker compose up`.
# Use `docker compose -f docker-compose.yml -f docker-compose.postgres.yml up` for Postgres.
services:
  deploymonster:
    build:
      context: .
      dockerfile: deployments/Dockerfile
    ports:
      - "8443:8443"
      - "80:80"
      - "443:443"
    volumes:
      - dm-data:/var/lib/deploymonster
    environment:
      - MONSTER_HOST=0.0.0.0
      - MONSTER_PORT=8443
      - MONSTER_LOG_LEVEL=debug
    restart: unless-stopped

volumes:
  dm-data:
